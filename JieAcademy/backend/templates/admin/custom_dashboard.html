<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>后台控制面板</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); flex: 1; }
        .card-title { font-size: 14px; color: #909399; margin-bottom: 10px; }
        .card-number { font-size: 32px; font-weight: bold; color: #303133; }
        .chart-container { height: 400px; width: 100%; }
        .col-8 { flex: 2; }
        .col-4 { flex: 1; }
    </style>
</head>
<body>

    <!-- 顶栏数据块 -->
    <div class="row">
        <div class="card">
            <div class="card-title">总用户数</div>
            <div class="card-number" style="color: #409EFF">{{ total_users }}</div>
        </div>
        <div class="card">
            <div class="card-title">今日新增用户</div>
            <div class="card-number" style="color: #67C23A">{{ new_users_today }}</div>
        </div>
        <div class="card">
            <div class="card-title">累计玩家心得数</div>
            <div class="card-number" style="color: #E6A23C">{{ total_contributions }}</div>
        </div>
    </div>

    <!-- 图表块 -->
    <div class="row">
        <div class="card col-8">
            <div class="card-title">最近 7 天用户增长趋势</div>
            <div id="trendChart" class="chart-container"></div>
        </div>
        <div class="card col-4">
            <div class="card-title">玩家发布内容分类</div>
            <div id="pieChart" class="chart-container"></div>
        </div>
    </div>

    <script>
        // 折线图
        var trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: {{ user_trend_labels|safe }} },
            yAxis: { type: 'value' },
            series: [{
                data: {{ user_trend_data|safe }},
                type: 'line',
                smooth: true,
                areaStyle: {},
                itemStyle: { color: '#409EFF' }
            }]
        });

        // 饼图
        var pieChart = echarts.init(document.getElementById('pieChart'));
        pieChart.setOption({
            tooltip: { trigger: 'item' },
            legend: { top: 'bottom' },
            series: [{
                name: '内容分类',
                type: 'pie',
                radius: ['40%', '70%'],
                avoidLabelOverlap: false,
                itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                label: { show: false, position: 'center' },
                emphasis: {
                    label: { show: true, fontSize: 20, fontWeight: 'bold' }
                },
                labelLine: { show: false },
                data: {{ category_data|safe }}
            }],
            color: ['#F56C6C', '#E6A23C']
        });

        // 自适应调整
        window.onresize = function() {
            trendChart.resize();
            pieChart.resize();
        };
    </script>
</body>
</html>
